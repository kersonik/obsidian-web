<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0a0a0d" rx="12"/>
  
  <!-- Connections -->
  <line x1="80" y1="120" x2="200" y2="60" stroke="#7f6df2" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="80" y1="120" x2="200" y2="180" stroke="#7f6df2" stroke-width="2"/>
  <line x1="200" y1="60" x2="320" y2="120" stroke="#00bfa5" stroke-width="2"/>
  <line x1="200" y1="180" x2="320" y2="120" stroke="#00bfa5" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Center Node -->
  <circle cx="80" cy="120" r="28" fill="#1b182b" stroke="#7f6df2" stroke-width="3" filter="url(#glow)"/>
  <text x="80" y="125" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Poznámka</text>

  <!-- Top Node -->
  <circle cx="200" cy="60" r="22" fill="#132220" stroke="#00bfa5" stroke-width="2"/>
  <text x="200" y="65" fill="#00bfa5" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">Graf</text>

  <!-- Bottom Node -->
  <circle cx="200" cy="180" r="22" fill="#291a24" stroke="#ff5555" stroke-width="2"/>
  <text x="200" y="185" fill="#ff5555" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">SVG</text>

  <!-- Right Node -->
  <circle cx="320" cy="120" r="28" fill="#2b2315" stroke="#ffd700" stroke-width="3" filter="url(#glow)"/>
  <text x="320" y="125" fill="#ffd700" font-family="-apple-system, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Obsidian</text>
</svg>
